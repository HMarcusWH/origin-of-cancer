name: Materialize reviewed OoC bootstrap
on:
  push:
    branches: [main]
    paths: ['.bootstrap/transfer.json']
permissions:
  contents: write
concurrency:
  group: ooc-bootstrap-once
  cancel-in-progress: false
jobs:
  materialize:
    if: ${{ contains(github.event.head_commit.message, '[bootstrap-transport]') }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'
      - name: Verify and materialize the exact reviewed public-release payload
        shell: bash
        run: |
          set -euo pipefail
          test ! -e BASELINE.md
          python - <<'PY'
          import hashlib,io,json,os,pathlib,stat,urllib.parse,urllib.request,zipfile
          root=pathlib.Path.cwd()
          config=json.loads((root/'.bootstrap/transfer.json').read_text())
          url=config['download_url']
          print('::add-mask::'+url)
          parsed=urllib.parse.urlparse(url)
          if parsed.scheme!='https' or not (parsed.hostname or '').endswith('.oaiusercontent.com'):
              raise SystemExit('Unapproved release-payload host')
          with urllib.request.urlopen(url,timeout=120) as response:
              payload=response.read(30_000_001)
          if len(payload)>30_000_000 or hashlib.sha256(payload).hexdigest()!=config['sha256']:
              raise SystemExit('Payload size/hash mismatch')
          with zipfile.ZipFile(io.BytesIO(payload)) as archive:
              entries=archive.infolist()
              if len(entries)>3000 or sum(i.file_size for i in entries)>100_000_000:
                  raise SystemExit('Archive expansion limit exceeded')
              seen=set()
              for info in entries:
                  p=pathlib.PurePosixPath(info.filename)
                  if (p.is_absolute() or '..' in p.parts or not p.parts or '.git' in p.parts
                      or '\\' in info.filename or ':' in p.parts[0]
                      or stat.S_ISLNK(info.external_attr>>16) or info.filename in seen):
                      raise SystemExit('Unsafe or duplicate member: '+info.filename)
                  seen.add(info.filename)
                  if info.is_dir():continue
                  data=archive.read(info)
                  target=root.joinpath(*p.parts)
                  if not target.resolve().is_relative_to(root):raise SystemExit('Path escape')
                  if info.filename.startswith('.github/workflows/'):
                      if not target.is_file() or target.read_bytes()!=data:
                          raise SystemExit('Workflow must exactly match connector-authored reviewed version')
                      continue
                  target.parent.mkdir(parents=True,exist_ok=True)
                  target.write_bytes(data)
          (root/'.bootstrap/transfer.json').unlink()
          print('Verified public-release payload materialized; transient delivery pointer removed.')
          PY
      - name: Validate the materialized bootstrap
        run: |
          python -m pip install -r requirements.txt
          python tools/validate.py
          python tools/build.py --check
          python -m unittest discover -s tests -v
      - name: Publish review branch without modifying main
        run: |
          git switch -c bootstrap/ooc-research-baseline
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'bootstrap: freeze OoC research, graph, documentation and modeling baseline'
          git push origin HEAD:refs/heads/bootstrap/ooc-research-baseline
