name: Refresh PR generated products once
on:
  push:
    branches: ['fix/codex-review-hardening']
permissions:
  contents: write
concurrency:
  group: ooc-regenerate-one-shot
  cancel-in-progress: true
jobs:
  regenerate:
    if: github.repository == 'HMarcusWH/origin-of-cancer' && github.ref == 'refs/heads/fix/codex-review-hardening'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: true
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'
      - name: Materialize the exact final source state
        shell: bash
        run: |
          set -euo pipefail
          git rm .github/workflows/ooc-regenerate-once.yml
          python -m pip install -r requirements.txt
          python tools/validate.py
          python tools/build.py --write
          python -m unittest discover -s tests -v
          python tools/build.py --check
          git diff --exit-code -- sources/ BASELINE.md tests/fixtures/bootstrap_graph.json
      - name: Commit derived products and remove one-time workflow
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git diff --cached --name-only
          git commit -m 'chore: regenerate deterministic reviewer products and remove transient job'
          git push origin HEAD:refs/heads/fix/codex-review-hardening
