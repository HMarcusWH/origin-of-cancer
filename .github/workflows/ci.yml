name: OoC integrity
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ooc-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  integrity:
    if: ${{ github.event_name != 'push' || !contains(github.event.head_commit.message, '[bootstrap-transport]') }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.11', '3.12', '3.13']
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install pinned engineering dependencies
        run: python -m pip install -r requirements.txt
      - name: Validate source, graph and documentation contracts
        run: python tools/validate.py
      - name: Check deterministic generated state
        run: python tools/build.py --check
      - name: Run adversarial integrity and mathematical reference tests
        run: python -m unittest discover -s tests -v
      - name: Check immutable scientific memory on pull requests
        if: github.event_name == 'pull_request'
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: python tools/check_history.py --base "$BASE_SHA"
